<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glamour Admin</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="platform.css"></head><body><main class="admin-shell"><section id="login-panel" class="admin-panel"><h1>Glamour Admin</h1><p>Sign in with the Firebase Auth account authorized in the <code>admins/{uid}</code> collection.</p><form id="login-form" class="form-grid"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="button primary" type="submit">Sign In</button><p id="login-status" class="form-status"></p></form></section><section id="dashboard" hidden><div class="admin-toolbar"><div><p class="eyebrow">Glamour</p><h1>Admin Dashboard</h1></div><button id="logout" class="button secondary">Sign Out</button></div><section class="admin-panel"><h2>Publish gallery photo</h2><form id="gallery-form" class="form-grid"><label>Style name<input name="styleName" required maxlength="80"></label><label>Image description<input name="alt" required maxlength="160"></label><label>Photo<input name="image" type="file" accept="image/*" required></label><button class="button primary" type="submit">Upload & Publish</button><p id="gallery-status" class="form-status"></p></form></section><div class="admin-columns"><section class="admin-panel"><h2>Booking requests</h2><div id="bookings-list"></div></section><section class="admin-panel"><h2>Contact messages</h2><div id="contacts-list"></div></section><section class="admin-panel"><h2>Testimonials</h2><div id="testimonial-admin-list"></div></section><section class="admin-panel"><h2>Gallery</h2><div id="gallery-admin-list"></div></section></div></section></main><script type="module" src="admin.js"></script></body></html>
